[workspace]
resolver = "3"
members = ["crates/*", "vag2mqtt"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

# Lints are defined once here and inherited by every crate via `[lints] workspace = true`.
# CI runs clippy with `-D warnings`, so everything listed as `warn` fails the build there
# while staying a warning during local development.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

# Internal crates. The dependency edges below mirror the architecture rules in CLAUDE.md
# section 4; adding an edge that is not listed there needs a decision, not just an edit.
[workspace.dependencies]
vag2mqtt-admin = { path = "crates/vag2mqtt-admin" }
vag2mqtt-connector-api = { path = "crates/vag2mqtt-connector-api" }
vag2mqtt-connector-audi = { path = "crates/vag2mqtt-connector-audi" }
vag2mqtt-domain = { path = "crates/vag2mqtt-domain" }
vag2mqtt-mqtt = { path = "crates/vag2mqtt-mqtt" }
vag2mqtt-persistence = { path = "crates/vag2mqtt-persistence" }
vag2mqtt-runtime = { path = "crates/vag2mqtt-runtime" }

# External crates. Only what is actually in use today is listed; each work package adds
# what it needs (reqwest, rumqttc, sqlx, axum, askama, chacha20poly1305, ...) so that no
# unverified version constraints sit here unused.
anyhow = "1"
askama = "0.16"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
rpassword = "7"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rumqttd = { version = "0.20", default-features = false }
scraper = "0.23"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
zeroize = "1"
# EU Data Act packages are ZIP archives; pure Rust deflate only, no C toolchain.
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
